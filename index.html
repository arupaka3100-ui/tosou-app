<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>塗装面積 AI計測</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN',sans-serif;background:#f5f5f0;min-height:100vh;padding-bottom:80px}
header{background:#1a1a2e;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px;font-weight:600}
.beta{font-size:11px;background:#e94560;padding:2px 8px;border-radius:20px}
.container{padding:16px;max-width:600px;margin:0 auto}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid #e0e0d8}
.card-title{font-size:12px;font-weight:600;color:#888;margin-bottom:12px}
.note-box{background:#fffbf0;border:1px solid #f0e0a0;border-radius:8px;padding:12px;font-size:12px;color:#886600;margin-bottom:14px;line-height:1.6}
.warn-box{background:#fff0f0;border:1px solid #ffcccc;border-radius:8px;padding:12px;font-size:12px;color:#cc3333;margin-bottom:10px;display:none}
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;font-family:inherit}
.btn-primary{background:#e94560;color:white}
.btn-green{background:#2d9e5a;color:white}
.btn-blue{background:#0066cc;color:white}
.btn-outline{background:white;color:#1a1a2e;border:1.5px solid #e0e0d8}
.btn-sm{padding:10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none}
.spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ローディング */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,.92);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loading-overlay.show{display:flex}
.loading-text{color:white;font-size:15px;font-weight:600}
.loading-sub{color:rgba(255,255,255,.6);font-size:12px}
.brush-wrap{width:260px;height:50px;position:relative}
.brush-track{position:absolute;bottom:10px;left:0;width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:4px}
.brush-paint{position:absolute;bottom:10px;left:0;width:0%;height:8px;background:linear-gradient(90deg,#8B4513,#e07000,#ff9900);border-radius:4px}
.brush-icon{position:absolute;bottom:12px;font-size:26px;left:0}

/* 写真キャンバスエリア */
.photo-wrap{position:relative;border-radius:8px;overflow:hidden;margin-bottom:10px;background:#000;touch-action:none;-webkit-user-select:none;user-select:none}
.photo-img{width:100%;display:block}
.photo-canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.cursor-dot{position:fixed;width:16px;height:16px;border:3px solid #e94560;border-radius:50%;pointer-events:none;display:none;z-index:999;transform:translate(-50%,-150%);background:rgba(233,69,96,0.3)}

/* ステータス */
.status-bar{border-radius:8px;padding:12px;margin-bottom:10px;font-size:13px;font-weight:600;text-align:center;color:white}
.status-primary{background:#e94560}
.status-blue{background:#0066cc}
.status-green{background:#2d9e5a}

/* 開口部リスト */
.op-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1.5px solid #e0e0d8;margin-bottom:8px}
.op-item.confirmed{border-color:#2d9e5a;background:#f0fff4}
.op-item.ai-suggest{border-color:#cc8800;background:#fffbf0}
.op-item.editing{border-color:#0066cc;background:#f0f8ff}
.op-color{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.op-label{flex:1;font-size:13px;font-weight:600}
.op-size{font-size:11px;color:#888}
.op-actions{display:flex;gap:6px}
.op-btn{border:none;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.op-btn-confirm{background:#2d9e5a;color:white}
.op-btn-redraw{background:#0066cc;color:white}
.op-btn-del{background:#cc3333;color:white}

/* 実測入力 */
.measure-card{background:#f0f8ff;border:2px solid #0066cc;border-radius:12px;padding:16px;margin-bottom:14px}
.measure-title{font-size:13px;font-weight:700;color:#0066cc;margin-bottom:12px}
.measure-row{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.measure-label{font-size:13px;font-weight:600;min-width:80px}
.req{font-size:10px;background:#cc3333;color:white;padding:1px 6px;border-radius:8px;margin-left:4px}
.measure-input{flex:1;border:2px solid #b8d8f8;border-radius:8px;padding:11px;font-size:20px;font-family:inherit;background:white;text-align:center;font-weight:700;-webkit-appearance:none}
.measure-input:focus{outline:none;border-color:#0066cc}
.measure-unit{font-size:13px;color:#888;min-width:18px}

/* 結果 */
.result-card{background:#1a1a2e;color:white;border-radius:12px;padding:18px;margin-bottom:14px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:rgba(255,255,255,.08);border-radius:8px;padding:11px}
.metric-label{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:3px}
.metric-value{font-size:20px;font-weight:700}
.metric-value.red{color:#ff6b7a}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.detail-row:last-child{border-bottom:none}
.copy-btn{width:100%;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:11px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="brush-wrap">
    <div class="brush-track"></div>
    <div class="brush-paint" id="brushPaint"></div>
    <div class="brush-icon" id="brushIcon">🖌️</div>
  </div>
  <div class="loading-text" id="loadingText">AI解析中...</div>
  <div class="loading-sub" id="loadingSub">しばらくお待ちください</div>
</div>

<div class="cursor-dot" id="cursorDot"></div>

<header><h1>塗装面積 AI計測</h1><span class="beta">Beta</span></header>
<div class="container">

  <!-- Step1: アップロード -->
  <div id="step1">
    <div class="card">
      <div class="card-title">外壁写真をアップロード</div>
      <div style="position:relative;border:2px dashed #e0e0d8;border-radius:8px;background:white;overflow:hidden">
        <div id="uploadPlaceholder" style="padding:40px 20px;text-align:center">
          <div style="font-size:40px;margin-bottom:10px">🏠</div>
          <div style="font-size:15px;font-weight:600;margin-bottom:6px">写真をタップして選択</div>
          <div style="font-size:12px;color:#888">カメラまたはライブラリから</div>
        </div>
        <img id="uploadPreview" style="width:100%;display:none;border-radius:8px">
        <input type="file" id="fileInput" accept="image/*" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer" onchange="onFileChange(this)">
      </div>
      <button class="btn btn-outline btn-sm" id="retakeBtn" style="display:none;margin-top:8px" onclick="document.getElementById('fileInput').click()">📷 撮り直す</button>
    </div>
    <div class="note-box">建物全体が写るよう少し離れて撮影してください。</div>
    <button class="btn btn-primary" id="step1Next" onclick="startDetect()" disabled>
      <div class="spinner" id="detectSpinner"></div>
      <span id="detectBtnText">AIで開口部を認識する →</span>
    </button>
  </div>

  <!-- Step2: AI認識結果を確認・修正 -->
  <div id="step2" class="hidden">
    <div class="status-bar status-blue" id="step2Status">AIが認識した開口部を確認してください</div>

    <div class="photo-wrap" id="photoWrap">
      <img id="photoImg" class="photo-img">
      <canvas id="photoCanvas" class="photo-canvas"></canvas>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <button style="flex:0 0 80px;border:1.5px solid #e0e0d8;background:white;border-radius:8px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit" onclick="clearRedraw()">やり直す</button>
      <button class="btn btn-blue btn-sm" style="margin:0;flex:1" id="confirmRedrawBtn" onclick="confirmRedraw()" disabled>なぞり直しを確定</button>
    </div>

    <div class="card">
      <div class="card-title">認識した開口部一覧</div>
      <div id="opList"></div>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;margin-bottom:0" onclick="addOpening()">＋ 開口部を手動追加</button>
    </div>

    <div class="note-box">
      ✓確定：AIの認識が正しい場合<br>
      なぞり直し：位置がずれている場合は写真上でなぞり直してください<br>
      削除：誤認識の場合
    </div>
    <button class="btn btn-green" onclick="goToStep3()">次へ：実測値を入力する →</button>
  </div>

  <!-- Step3: 実測値入力・計算 -->
  <div id="step3" class="hidden">
    <div class="measure-card">
      <div class="measure-title">📏 外壁の実測値を入力</div>
      <div class="measure-row">
        <label class="measure-label">横幅<span class="req">必須</span></label>
        <input type="number" class="measure-input" id="widthInput" placeholder="8.0" step="0.1" min="0.1" inputmode="decimal">
        <span class="measure-unit">m</span>
      </div>
      <div class="measure-row">
        <label class="measure-label">高さ<span class="req">必須</span></label>
        <input type="number" class="measure-input" id="heightInput" placeholder="5.0" step="0.1" min="0.1" inputmode="decimal">
        <span class="measure-unit">m</span>
      </div>
      <button class="btn btn-green" id="calcBtn" onclick="doCalc()">
        <div class="spinner" id="calcSpinner"></div>
        <span id="calcBtnText">📐 AIで面積を計算する</span>
      </button>
      <div class="warn-box" id="calcErr"></div>
    </div>

    <!-- 結果写真 -->
    <div id="resultPhotoWrap" class="hidden">
      <div class="card">
        <div class="card-title">計算結果（写真上に表示）</div>
        <div style="position:relative;border-radius:8px;overflow:hidden">
          <img id="resultImg" style="width:100%;display:block">
          <canvas id="resultCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none"></canvas>
        </div>
        <div style="font-size:11px;color:#888;text-align:center;margin-top:6px">表示：幅（横）× 高さ（縦）</div>
      </div>
    </div>

    <!-- 数値結果 -->
    <div id="resultCard" class="hidden">
      <div class="result-card">
        <div class="metrics">
          <div class="metric"><div class="metric-label">外壁面積</div><div class="metric-value" id="rWall">—</div></div>
          <div class="metric"><div class="metric-label">塗装面積</div><div class="metric-value red" id="rPaint">—</div></div>
        </div>
        <div id="rDetails"></div>
        <button class="copy-btn" onclick="copyResult()">📋 jimuuにコピーする</button>
      </div>
      <div class="note-box" id="rNote" style="display:none"></div>
    </div>

    <button class="btn btn-outline" onclick="goBackStep2()">← 開口部を修正する</button>
    <button class="btn btn-outline" onclick="resetAll()">最初からやり直す</button>
  </div>

</div>

<script>
var COLORS = ['#e94560','#0066cc','#2d9e5a','#cc8800','#9933cc','#e07000'];

var state = {
  imageSrc: null, imageBase64: null, imageMediaType: 'image/jpeg',
  imgW: 0, imgH: 0,
  openings: [],      // [{id, type, bbox, confirmed, color, widthM, heightM}]
  editingId: null,   // なぞり直し中の開口部ID
  drawPoints: [],    // なぞり中の点列
  isDrawing: false,
  blinkTimer: null, blinkOn: false,
  brushTimer: null,
  calcResult: null
};

// ===== ファイル選択 =====
function onFileChange(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    state.imageSrc = ev.target.result;
    state.imageBase64 = ev.target.result.split(',')[1];
    state.imageMediaType = file.type || 'image/jpeg';
    document.getElementById('uploadPlaceholder').style.display = 'none';
    document.getElementById('uploadPreview').src = state.imageSrc;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('retakeBtn').style.display = 'flex';
    document.getElementById('step1Next').disabled = false;
  };
  reader.readAsDataURL(file);
}

// ===== AI認識 =====
async function startDetect() {
  document.getElementById('detectSpinner').style.display = 'block';
  document.getElementById('detectBtnText').textContent = '解析中...';
  document.getElementById('step1Next').disabled = true;
  showLoading('AI解析中...', '開口部（窓・ドア）を認識しています');
  try {
    var res = await fetch('/api/analyze', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({step: 'detect', imageBase64: state.imageBase64, imageMediaType: state.imageMediaType})
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'APIエラー');
    // 開口部データを初期化
    state.openings = (data.openings || []).map(function(op, i) {
      return {
        id: op.id || ('op' + i),
        type: op.type,
        bbox: op.bbox,
        confidence: op.confidence,
        note: op.note,
        confirmed: false,
        color: COLORS[i % COLORS.length],
        widthM: null, heightM: null
      };
    });
    state.buildingInfo = data.buildingInfo;
    hideLoading();
    goToStep2();
  } catch(e) {
    hideLoading();
    alert('エラー：' + e.message);
    document.getElementById('detectSpinner').style.display = 'none';
    document.getElementById('detectBtnText').textContent = 'AIで開口部を認識する →';
    document.getElementById('step1Next').disabled = false;
  }
}

// ===== Step2: 確認・修正 =====
function goToStep2() {
  var img = document.getElementById('photoImg');
  img.src = state.imageSrc;
  img.onload = function() {
    state.imgW = img.naturalWidth;
    state.imgH = img.naturalHeight;
    var canvas = document.getElementById('photoCanvas');
    canvas.width = state.imgW;
    canvas.height = state.imgH;
    setupDrawEvents();
    renderPhoto();
    buildOpList();
  };
  show('step2');
}

function setupDrawEvents() {
  var canvas = document.getElementById('photoCanvas');
  canvas.addEventListener('touchstart', function(e) { e.preventDefault(); onDS(e); }, {passive:false});
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); onDM(e); }, {passive:false});
  canvas.addEventListener('touchend', function(e) { onDE(e); }, {passive:false});
  canvas.addEventListener('mousedown', onDS);
  canvas.addEventListener('mousemove', onDM);
  canvas.addEventListener('mouseup', onDE);
}

function getP(e) {
  var canvas = document.getElementById('photoCanvas');
  var rect = canvas.getBoundingClientRect();
  var sx = canvas.width / rect.width, sy = canvas.height / rect.height;
  var src = e.touches ? e.touches[0] : e;
  return {x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy, cx: src.clientX, cy: src.clientY};
}

function onDS(e) {
  if (!state.editingId) return;
  state.isDrawing = true;
  state.drawPoints = [];
  var p = getP(e);
  state.drawPoints.push(p);
  moveCursor(p.cx, p.cy);
}

function onDM(e) {
  if (!state.isDrawing) return;
  var p = getP(e);
  state.drawPoints.push(p);
  moveCursor(p.cx, p.cy);
  renderPhoto();
}

function onDE(e) {
  if (!state.isDrawing) return;
  state.isDrawing = false;
  hideCursor();
  if (state.drawPoints.length > 3) {
    document.getElementById('confirmRedrawBtn').disabled = false;
    document.getElementById('step2Status').textContent = 'なぞり直しができました。確定してください。';
    startBlink();
  }
  renderPhoto();
}

function moveCursor(cx, cy) {
  var dot = document.getElementById('cursorDot');
  dot.style.display = 'block';
  dot.style.left = cx + 'px';
  dot.style.top = cy + 'px';
}
function hideCursor() { document.getElementById('cursorDot').style.display = 'none'; }

function startBlink() {
  stopBlink();
  state.blinkTimer = setInterval(function() {
    state.blinkOn = !state.blinkOn;
    renderPhoto();
  }, 400);
}
function stopBlink() {
  if (state.blinkTimer) clearInterval(state.blinkTimer);
  state.blinkTimer = null; state.blinkOn = false;
}

// 写真上に全開口部を描画
function renderPhoto() {
  var canvas = document.getElementById('photoCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 確定済み・AI認識済みの開口部を描画
  state.openings.forEach(function(op) {
    if (!op.bbox) return;
    var b = op.bbox;
    var x = b.x / 100 * canvas.width;
    var y = b.y / 100 * canvas.height;
    var w = b.w / 100 * canvas.width;
    var h = b.h / 100 * canvas.height;
    var col = op.color;
    var alpha = op.confirmed ? '99' : '66';

    // 編集中は点滅
    if (op.id === state.editingId && state.blinkOn) {
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.setLineDash([8,4]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
    } else if (op.id === state.editingId && !state.blinkOn) {
      // 点滅OFF
    } else {
      ctx.strokeStyle = col; ctx.lineWidth = op.confirmed ? 3 : 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = col + '22'; ctx.fillRect(x, y, w, h);
    }

    // ラベル
    if (!(op.id === state.editingId && !state.blinkOn)) {
      var fs = Math.max(13, canvas.width / 45);
      ctx.font = 'bold ' + fs + 'px sans-serif';
      var label = op.type + (op.confirmed ? ' ✓' : ' ?');
      var tw = ctx.measureText(label).width;
      ctx.fillStyle = col;
      ctx.fillRect(x, y - fs - 4, tw + 8, fs + 4);
      ctx.fillStyle = 'white';
      ctx.fillText(label, x + 4, y - 4);
    }
  });

  // なぞり直し中の線
  if (state.isDrawing && state.drawPoints.length > 1 || (state.drawPoints.length > 3 && state.blinkTimer)) {
    var pts = state.drawPoints;
    var xs = pts.map(function(p){return p.x;}), ys = pts.map(function(p){return p.y;});
    var x = Math.min.apply(null,xs), y = Math.min.apply(null,ys);
    var w = Math.max.apply(null,xs)-x, h = Math.max.apply(null,ys)-y;
    if (state.blinkOn || state.isDrawing) {
      ctx.strokeStyle = '#e94560'; ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = 'rgba(233,69,96,0.1)'; ctx.fillRect(x, y, w, h);
    }
  }
}

// 開口部リストを構築
function buildOpList() {
  var list = document.getElementById('opList');
  if (state.openings.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:#888;padding:8px">開口部が認識されませんでした。手動で追加してください。</div>';
    return;
  }
  list.innerHTML = state.openings.map(function(op, i) {
    var statusColor = op.confirmed ? '#2d9e5a' : '#cc8800';
    var statusText = op.confirmed ? '✓確定' : (op.confidence === 'low' ? '要確認' : 'AI推定');
    var isEditing = op.id === state.editingId;
    return '<div class="op-item ' + (op.confirmed ? 'confirmed' : isEditing ? 'editing' : 'ai-suggest') + '">' +
      '<div class="op-color" style="background:' + op.color + '"></div>' +
      '<div>' +
        '<div class="op-label">' + (i+1) + '. ' + op.type + '</div>' +
        '<div class="op-size" style="color:' + statusColor + '">' + statusText +
          (op.note ? ' ・' + op.note : '') + '</div>' +
      '</div>' +
      '<div class="op-actions">' +
        (!op.confirmed ? '<button class="op-btn op-btn-confirm" onclick="confirmOp(\'' + op.id + '\')">✓確定</button>' : '') +
        '<button class="op-btn op-btn-redraw" onclick="startRedraw(\'' + op.id + '\')">' + (isEditing ? '描画中' : 'なぞり直し') + '</button>' +
        '<button class="op-btn op-btn-del" onclick="deleteOp(\'' + op.id + '\')">削除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function confirmOp(id) {
  var op = state.openings.find(function(o){return o.id===id;});
  if (op) { op.confirmed = true; }
  buildOpList(); renderPhoto();
}

function startRedraw(id) {
  state.editingId = id;
  state.drawPoints = [];
  stopBlink();
  document.getElementById('confirmRedrawBtn').disabled = true;
  document.getElementById('step2Status').textContent = '写真上で開口部の範囲をなぞってください';
  buildOpList(); renderPhoto();
}

function clearRedraw() {
  state.drawPoints = [];
  state.editingId = null;
  stopBlink();
  document.getElementById('confirmRedrawBtn').disabled = true;
  document.getElementById('step2Status').textContent = 'AIが認識した開口部を確認してください';
  buildOpList(); renderPhoto();
}

function confirmRedraw() {
  if (!state.editingId || state.drawPoints.length < 3) return;
  var op = state.openings.find(function(o){return o.id===state.editingId;});
  if (op) {
    var pts = state.drawPoints;
    var xs = pts.map(function(p){return p.x;}), ys = pts.map(function(p){return p.y;});
    var minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
    var minY = Math.min.apply(null,ys), maxY = Math.max.apply(null,ys);
    var canvas = document.getElementById('photoCanvas');
    op.bbox = {
      x: minX/canvas.width*100, y: minY/canvas.height*100,
      w: (maxX-minX)/canvas.width*100, h: (maxY-minY)/canvas.height*100
    };
    op.confirmed = true;
  }
  state.editingId = null;
  state.drawPoints = [];
  stopBlink();
  document.getElementById('confirmRedrawBtn').disabled = true;
  document.getElementById('step2Status').textContent = '修正しました。他の開口部も確認してください。';
  buildOpList(); renderPhoto();
}

function deleteOp(id) {
  state.openings = state.openings.filter(function(o){return o.id!==id;});
  if (state.editingId === id) { state.editingId = null; stopBlink(); }
  buildOpList(); renderPhoto();
}

function addOpening() {
  var type = prompt('開口部の種類を入力してください\n例：引き違い窓、玄関ドア、掃き出し窓、FIX窓、小窓');
  if (!type) return;
  var newId = 'manual_' + Date.now();
  state.openings.push({
    id: newId, type: type,
    bbox: {x: 35, y: 35, w: 15, h: 20},
    confidence: 'manual', note: '手動追加',
    confirmed: false, color: COLORS[state.openings.length % COLORS.length],
    widthM: null, heightM: null
  });
  buildOpList(); renderPhoto();
  startRedraw(newId);
}

// ===== Step3: 実測値入力・AI計算 =====
function goToStep3() {
  show('step3');
  document.getElementById('resultImg').src = state.imageSrc;
}

function goBackStep2() {
  show('step2');
  buildOpList(); renderPhoto();
}

async function doCalc() {
  var w = parseFloat(document.getElementById('widthInput').value);
  var h = parseFloat(document.getElementById('heightInput').value);
  var err = document.getElementById('calcErr');
  err.style.display = 'none';
  if (!w || w <= 0) { err.textContent = '横幅を入力してください'; err.style.display = 'block'; return; }
  if (!h || h <= 0) { err.textContent = '高さを入力してください'; err.style.display = 'block'; return; }

  var confirmedOps = state.openings.filter(function(op){ return op.confirmed || op.confidence !== 'manual'; });
  if (confirmedOps.length === 0) { err.textContent = '開口部を1つ以上確定してください'; err.style.display = 'block'; return; }

  var btn = document.getElementById('calcBtn');
  var sp = document.getElementById('calcSpinner');
  var bt = document.getElementById('calcBtnText');
  btn.disabled = true; sp.style.display = 'block'; bt.textContent = 'AIが計算中...';
  showLoading('AIで面積計算中...', '遠近補正・標準サイズ照合を行っています');

  try {
    var res = await fetch('/api/analyze', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        step: 'calculate',
        imageBase64: state.imageBase64,
        imageMediaType: state.imageMediaType,
        width: w, height: h,
        openings: confirmedOps.map(function(op) {
          return {id: op.id, type: op.type, bbox: op.bbox};
        })
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '計算エラー');
    hideLoading();

    // 結果を開口部に反映
    (data.openings || []).forEach(function(r) {
      var op = state.openings.find(function(o){return o.id===r.id;});
      if (op) { op.widthM = r.widthM; op.heightM = r.heightM; op.areaM = r.areaM; op.warning = r.warning; }
    });

    state.calcResult = data;
    renderResultPhoto(w, h);
    showResult(w, h, data);

  } catch(e) {
    hideLoading();
    err.textContent = 'エラー：' + e.message; err.style.display = 'block';
  }
  btn.disabled = false; sp.style.display = 'none'; bt.textContent = '📐 AIで面積を計算する';
}

function renderResultPhoto(w, h) {
  var img = document.getElementById('resultImg');
  var canvas = document.getElementById('resultCanvas');
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  state.openings.forEach(function(op) {
    if (!op.bbox || !op.widthM) return;
    var b = op.bbox;
    var x = b.x/100*canvas.width, y = b.y/100*canvas.height;
    var bw = b.w/100*canvas.width, bh = b.h/100*canvas.height;
    ctx.strokeStyle = op.color; ctx.lineWidth = 3;
    ctx.strokeRect(x, y, bw, bh);
    ctx.fillStyle = op.color + '33'; ctx.fillRect(x, y, bw, bh);

    // サイズラベル
    var fs = Math.max(13, canvas.width/50);
    ctx.font = 'bold ' + fs + 'px sans-serif';
    var label = '幅' + op.widthM.toFixed(2) + 'm × 高' + op.heightM.toFixed(2) + 'm';
    if (op.warning) label += ' ⚠';
    var tw = ctx.measureText(label).width;
    ctx.fillStyle = op.warning ? '#cc3333' : op.color;
    ctx.fillRect(x, y - fs - 6, tw + 8, fs + 6);
    ctx.fillStyle = 'white'; ctx.fillText(label, x + 4, y - 4);
  });

  // 凡例
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, canvas.height - 28, canvas.width, 28);
  ctx.fillStyle = 'white'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText('表示：幅（横）× 高さ（縦）', 8, canvas.height - 9);

  document.getElementById('resultPhotoWrap').classList.remove('hidden');
}

function showResult(w, h, data) {
  var wallArea = (data.wallArea || w * h).toFixed(1);
  var paintArea = (data.paintArea || 0).toFixed(1);
  document.getElementById('rWall').textContent = wallArea + ' m²';
  document.getElementById('rPaint').textContent = paintArea + ' m²';

  var details = '';
  state.openings.forEach(function(op, i) {
    if (!op.widthM) return;
    var warn = op.warning ? '<span style="color:#ff6b7a"> ⚠' + op.warning + '</span>' : '';
    details += '<div class="detail-row">' +
      '<span style="color:rgba(255,255,255,.7)">' + (i+1) + ' ' + op.type + '</span>' +
      '<span>' + op.widthM.toFixed(2) + 'm×' + op.heightM.toFixed(2) + 'm =' + (op.areaM||0).toFixed(1) + 'm²' + warn + '</span>' +
      '</div>';
  });
  details += '<div class="detail-row"><span style="color:rgba(255,255,255,.6)">開口部合計</span><span>−' + (data.totalOpeningArea||0).toFixed(1) + ' m²</span></div>';
  document.getElementById('rDetails').innerHTML = details;

  if (data.note) {
    document.getElementById('rNote').textContent = 'AI注記：' + data.note;
    document.getElementById('rNote').style.display = 'block';
  }

  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('resultCard').scrollIntoView({behavior: 'smooth'});
}

function copyResult() {
  var w = parseFloat(document.getElementById('widthInput').value);
  var h = parseFloat(document.getElementById('heightInput').value);
  var d = state.calcResult;
  var text = '【塗装面積 AI計測結果】\n横幅：' + w + 'm　高さ：' + h + 'm\n外壁面積：' + (d.wallArea||w*h).toFixed(1) + ' m²\n';
  state.openings.forEach(function(op,i){
    if(!op.widthM)return;
    text += (i+1)+' '+op.type+'：'+op.widthM.toFixed(2)+'m×'+op.heightM.toFixed(2)+'m ='+(op.areaM||0).toFixed(1)+' m²\n';
  });
  text += '開口部合計：' + (d.totalOpeningArea||0).toFixed(1) + ' m²\n塗装面積：' + (d.paintArea||0).toFixed(1) + ' m²';
  navigator.clipboard.writeText(text).then(function(){
    var btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ コピーしました！';
    setTimeout(function(){ btn.textContent = '📋 jimuuにコピーする'; }, 2000);
  });
}

// ===== ローディング =====
function showLoading(text, sub) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingSub').textContent = sub;
  document.getElementById('loadingOverlay').classList.add('show');
  var p = 0, paint = document.getElementById('brushPaint'), icon = document.getElementById('brushIcon');
  state.brushTimer = setInterval(function(){ p+=1.5; if(p>100)p=0; paint.style.width=p+'%'; icon.style.left='calc('+p+'% - 14px)'; }, 30);
}
function hideLoading() {
  clearInterval(state.brushTimer);
  document.getElementById('loadingOverlay').classList.remove('show');
  document.getElementById('brushPaint').style.width = '0%';
  document.getElementById('brushIcon').style.left = '0px';
}

function show(id) {
  ['step1','step2','step3'].forEach(function(s){ document.getElementById(s).classList.toggle('hidden', s!==id); });
  window.scrollTo(0,0);
}

function resetAll() {
  state.imageSrc=null; state.imageBase64=null; state.openings=[]; state.editingId=null;
  state.drawPoints=[]; stopBlink(); hideLoading();
  document.getElementById('uploadPlaceholder').style.display='block';
  document.getElementById('uploadPreview').style.display='none';
  document.getElementById('uploadPreview').src='';
  document.getElementById('retakeBtn').style.display='none';
  document.getElementById('fileInput').value='';
  document.getElementById('step1Next').disabled=true;
  document.getElementById('detectSpinner').style.display='none';
  document.getElementById('detectBtnText').textContent='AIで開口部を認識する →';
  document.getElementById('resultPhotoWrap').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  show('step1');
}
</script>
