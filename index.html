<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>塗装面積 AI計測</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN',sans-serif;background:#f5f5f0;min-height:100vh;padding-bottom:80px}
header{background:#1a1a2e;color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:16px;font-weight:600}
.beta{font-size:11px;background:#e94560;padding:2px 8px;border-radius:20px}
.container{padding:16px;max-width:600px;margin:0 auto}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:14px;border:1px solid #e0e0d8}
.card-title{font-size:12px;font-weight:600;color:#888;margin-bottom:14px}
.upload-area{border:2px dashed #e0e0d8;border-radius:8px;padding:40px 20px;text-align:center;background:white}
.upload-area img{width:100%;display:block;border-radius:8px}
.upload-icon{font-size:40px;margin-bottom:10px}
.upload-text{font-size:15px;font-weight:600;margin-bottom:6px}
.upload-sub{font-size:12px;color:#888}
.note-box{background:#fffbf0;border:1px solid #f0e0a0;border-radius:8px;padding:12px;font-size:12px;color:#886600;margin-bottom:14px;line-height:1.6}
.btn{width:100%;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;font-family:inherit;transition:opacity .15s}
.btn-primary{background:#e94560;color:white}
.btn-green{background:#2d9e5a;color:white}
.btn-outline{background:white;color:#1a1a2e;border:1.5px solid #e0e0d8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none}
.spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ローディング */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,.92);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.loading-overlay.show{display:flex}
.loading-text{color:white;font-size:15px;font-weight:600}
.loading-sub{color:rgba(255,255,255,.6);font-size:12px}
.brush-wrap{width:260px;height:50px;position:relative}
.brush-track{position:absolute;bottom:10px;left:0;width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:4px}
.brush-paint{position:absolute;bottom:10px;left:0;width:0%;height:8px;background:linear-gradient(90deg,#8B4513,#e07000,#ff9900);border-radius:4px}
.brush-icon{position:absolute;bottom:12px;font-size:26px;left:0}

/* エリア選択 */
.area-wrap{position:relative;border-radius:8px;overflow:hidden;margin-bottom:10px;touch-action:none;-webkit-user-select:none;user-select:none}
.area-img{width:100%;display:block}
.area-canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.hint-box{font-size:12px;color:#e94560;text-align:center;padding:8px;background:#fff0f3;border-radius:8px;margin-bottom:10px}
.btn-row{display:flex;gap:8px;margin-bottom:10px}
.btn-half{flex:1;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-clear{background:#f0f0e8;color:#1a1a2e}
.btn-confirm{background:#e94560;color:white}
.btn-confirm:disabled{opacity:.4}

/* 実측입력 */
.measure-card{background:#f0f8ff;border:2px solid #0066cc;border-radius:12px;padding:16px;margin-bottom:14px}
.measure-title{font-size:13px;font-weight:700;color:#0066cc;margin-bottom:14px}
.measure-row{margin-bottom:14px}
.measure-label{font-size:13px;font-weight:600;margin-bottom:6px;display:block}
.req{font-size:10px;background:#cc3333;color:white;padding:1px 6px;border-radius:8px;margin-left:6px}
.measure-input-row{display:flex;align-items:center;gap:8px}
.measure-input{flex:1;border:2px solid #b8d8f8;border-radius:8px;padding:12px;font-size:22px;font-family:inherit;background:white;text-align:center;font-weight:700;-webkit-appearance:none}
.measure-input:focus{outline:none;border-color:#0066cc}
.measure-unit{font-size:14px;color:#888;white-space:nowrap;min-width:16px}

/* 図面 */
.diagram-svg{width:100%;display:block;background:#f0f0ec;border-radius:8px;margin-bottom:10px}
.legend{font-size:11px;color:#888;text-align:center;padding:4px;display:flex;justify-content:center;gap:16px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px}

/* 開口部テーブル */
.op-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.op-table th{background:#f0f0e8;padding:6px 8px;text-align:left;font-weight:600;color:#888;border-bottom:1px solid #e0e0d8}
.op-table td{padding:7px 8px;border-bottom:1px solid #e0e0d8}

/* エリアタブ */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #e0e0d8;background:white;cursor:pointer;color:#888}
.tab.active{background:#1a1a2e;color:white;border-color:#1a1a2e}
.tab.done{background:#e8f8e8;color:#2d9e5a;border-color:#2d9e5a}

/* 結果 */
.result-card{background:#1a1a2e;color:white;border-radius:12px;padding:18px;margin-bottom:14px}
.result-title{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:14px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metric{background:rgba(255,255,255,.08);border-radius:8px;padding:11px}
.metric-label{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:3px}
.metric-value{font-size:20px;font-weight:700}
.metric-value.red{color:#ff6b7a}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.detail-row:last-child{border-bottom:none}
.copy-btn{width:100%;background:rgba(255,255,255,.12);color:white;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:11px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<!-- ローディング -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="brush-wrap">
    <div class="brush-track"></div>
    <div class="brush-paint" id="brushPaint"></div>
    <div class="brush-icon" id="brushIcon">🖌️</div>
  </div>
  <div class="loading-text" id="loadingText">AI解析中...</div>
  <div class="loading-sub" id="loadingSub">しばらくお待ちください</div>
</div>

<header>
  <h1>塗装面積 AI計測</h1>
  <span class="beta">Beta</span>
</header>

<div class="container">

  <!-- Step1: アップロード -->
  <div id="step1">
    <div class="card">
      <div class="card-title">外壁写真をアップロード</div>
      <!-- fileInputをvisibility:hiddenで高さ0にして確実にクリック可能に -->
      <div style="position:relative">
        <div id="uploadArea" style="border:2px dashed #e0e0d8;border-radius:8px;padding:40px 20px;text-align:center;background:white;cursor:pointer">
          <div class="upload-icon">🏠</div>
          <div class="upload-text">写真をタップして選択</div>
          <div class="upload-sub">カメラまたはライブラリから</div>
        </div>
        <input type="file" id="fileInput" accept="image/*"
          style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px">
      </div>
      <div id="previewArea" style="display:none;margin-top:10px">
        <img id="previewImg" style="width:100%;display:block;border-radius:8px">
        <div style="position:relative;margin-top:8px">
          <div class="btn btn-outline" style="margin-bottom:0;padding:10px;font-size:13px">📷 撮り直す</div>
          <input type="file" id="fileInput2" accept="image/*"
            style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px">
        </div>
      </div>
    </div>
    <div class="note-box">建物全体が写るよう少し離れて撮影してください。</div>
    <button class="btn btn-primary" id="step1Next" onclick="goStep2()" disabled>次へ →</button>
  </div>

  <!-- Step2: エリア選択 -->
  <div id="step2" class="hidden">
    <div class="card">
      <div class="card-title">測定エリアを指でなぞって囲む</div>
      <div class="area-wrap" id="areaWrap">
        <img id="areaImg" class="area-img" src="" alt="">
        <canvas id="areaCanvas" class="area-canvas"></canvas>
      </div>
      <div class="hint-box" id="areaHint">高さが同じ範囲を指でなぞって囲んでください（斜めOK）</div>
      <div class="btn-row">
        <button class="btn-half btn-clear" onclick="clearArea()">やり直す</button>
        <button class="btn-half btn-confirm" id="confirmAreaBtn" onclick="analyzeArea()" disabled>このエリアを解析する</button>
      </div>
    </div>
    <div class="note-box">高さが異なる部分は別々に囲んでください。複数エリアを追加できます。</div>
  </div>

  <!-- Step3: 実測入力・結果 -->
  <div id="step3" class="hidden">
    <div class="tabs" id="areaTabs"></div>

    <div class="measure-card">
      <div class="measure-title">📏 このエリアの実測値を入力</div>
      <div class="measure-row">
        <label class="measure-label">横幅<span class="req">必須</span><br><small style="font-weight:400;color:#888">地面レベルで測定</small></label>
        <div class="measure-input-row">
          <input type="number" class="measure-input" id="widthInput" placeholder="8.0" step="0.1" min="0.1" inputmode="decimal">
          <span class="measure-unit">m</span>
        </div>
      </div>
      <div class="measure-row">
        <label class="measure-label">高さ<span class="req">必須</span><br><small style="font-weight:400;color:#888">距離計で測定</small></label>
        <div class="measure-input-row">
          <input type="number" class="measure-input" id="heightInput" placeholder="5.0" step="0.1" min="0.1" inputmode="decimal">
          <span class="measure-unit">m</span>
        </div>
      </div>
      <button class="btn btn-green" id="calcBtn" onclick="doCalc()">
        <div class="spinner" id="calcSpinner"></div>
        <span id="calcBtnText">📐 面積を計算する</span>
      </button>
      <div style="color:#cc3333;font-size:13px;margin-top:8px;display:none" id="calcErr"></div>
    </div>

    <!-- 図面 -->
    <div id="diagramArea" class="hidden">
      <div class="card">
        <div class="card-title" id="diagramTitle">立面図</div>
        <svg id="diagramSvg" class="diagram-svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend">
          <span><span class="dot" style="background:#2d9e5a"></span>実測・確定</span>
          <span><span class="dot" style="background:#cc8800"></span>AI推定</span>
        </div>
        <div id="opTableWrap" style="margin-top:10px;display:none">
          <div style="font-size:12px;font-weight:600;color:#888;margin-bottom:6px">開口部一覧</div>
          <table class="op-table" id="opTable"></table>
        </div>
      </div>
    </div>

    <!-- 撮影写真 -->
    <div class="card">
      <div class="card-title">撮影写真（参照用）</div>
      <div id="photoRef"></div>
    </div>

    <div class="note-box" id="buildingNote" style="display:none"></div>

    <button class="btn btn-outline" onclick="addArea()">＋ 別のエリアを追加する</button>

    <!-- 全エリア合計 -->
    <div id="totalResult" class="hidden">
      <div class="result-card">
        <div class="result-title">計算結果（全エリア合計）</div>
        <div class="metrics">
          <div class="metric"><div class="metric-label">外壁総面積</div><div class="metric-value" id="rTotal">—</div></div>
          <div class="metric"><div class="metric-label">塗装面積</div><div class="metric-value red" id="rPaint">—</div></div>
        </div>
        <div id="rDetails"></div>
        <button class="copy-btn" onclick="copyResult()">📋 jimuuにコピーする</button>
      </div>
    </div>

    <button class="btn btn-outline" onclick="resetAll()">最初からやり直す</button>
  </div>

</div>

<script>
// ===== 状態管理 =====
var state = {
  imageBase64: null,
  imageSrc: null,
  imageMediaType: 'image/jpeg',
  areas: [],          // [{label, polyPoints, roofType, gableRatio, openings, buildingInfo, result}]
  currentIdx: 0,
  drawing: false,
  polyPoints: [],
  brushTimer: null
};

// ===== ファイル選択 =====
function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    state.imageSrc = ev.target.result;
    state.imageBase64 = ev.target.result.split(',')[1];
    state.imageMediaType = file.type || 'image/jpeg';
    document.getElementById('uploadArea').style.display = 'none';
    document.getElementById('previewImg').src = state.imageSrc;
    document.getElementById('previewArea').style.display = 'block';
    document.getElementById('step1Next').disabled = false;
  };
  reader.readAsDataURL(file);
}

document.getElementById('fileInput').addEventListener('change', function(e) {
  handleFile(e.target.files[0]);
});

document.addEventListener('change', function(e) {
  if (e.target && e.target.id === 'fileInput2') {
    handleFile(e.target.files[0]);
  }
});

// ===== Step2へ =====
function goStep2() {
  var img = document.getElementById('areaImg');
  img.src = state.imageSrc;
  img.onload = function() {
    var canvas = document.getElementById('areaCanvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    setupCanvas(canvas);
    clearArea();
  };
  show('step2');
  document.getElementById('photoRef').innerHTML =
    '<img src="' + state.imageSrc + '" style="width:100%;display:block;border-radius:8px">';
}

// ===== キャンバスイベント =====
function setupCanvas(canvas) {
  canvas.addEventListener('touchstart', onStart, {passive: false});
  canvas.addEventListener('touchmove', onMove, {passive: false});
  canvas.addEventListener('touchend', onEnd);
  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
}

function getXY(e, canvas) {
  var rect = canvas.getBoundingClientRect();
  var sx = canvas.width / rect.width;
  var sy = canvas.height / rect.height;
  var src = e.touches ? e.touches[0] : e;
  return {x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy};
}

function onStart(e) {
  e.preventDefault();
  state.drawing = true;
  state.polyPoints = [];
  var p = getXY(e, document.getElementById('areaCanvas'));
  state.polyPoints.push(p);
}

function onMove(e) {
  e.preventDefault();
  if (!state.drawing) return;
  var p = getXY(e, document.getElementById('areaCanvas'));
  state.polyPoints.push(p);
  drawPoly();
}

function onEnd(e) {
  if (!state.drawing) return;
  state.drawing = false;
  if (state.polyPoints.length > 1) {
    document.getElementById('confirmAreaBtn').disabled = false;
    document.getElementById('areaHint').textContent = 'エリアが選択されました（' + state.polyPoints.length + '点）。解析してください。';
  }
}

function drawPoly() {
  var canvas = document.getElementById('areaCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var pts = state.polyPoints;
  if (pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.fillStyle = 'rgba(233,69,96,0.08)';
  ctx.fill();
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(pts[0].x, pts[0].y, 6, 0, Math.PI * 2);
  ctx.fill();
}

function clearArea() {
  state.polyPoints = [];
  state.drawing = false;
  var canvas = document.getElementById('areaCanvas');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('confirmAreaBtn').disabled = true;
  document.getElementById('areaHint').textContent = '高さが同じ範囲を指でなぞって囲んでください（斜めOK）';
}

// ===== エリア解析 =====
async function analyzeArea() {
  if (state.polyPoints.length < 3) { 
    alert('エリアを選択してください（現在の点数：' + state.polyPoints.length + '）'); 
    return; 
  }
  document.getElementById('confirmAreaBtn').disabled = true;

  var canvas = document.getElementById('areaCanvas');
  var relPts = state.polyPoints.map(function(p) {
    return {
      x: parseFloat((p.x / canvas.width * 100).toFixed(1)),
      y: parseFloat((p.y / canvas.height * 100).toFixed(1))
    };
  });

  // バウンディングボックス
  var xs = relPts.map(function(p) { return p.x; });
  var ys = relPts.map(function(p) { return p.y; });
  var areaRect = {
    x: Math.min.apply(null, xs),
    y: Math.min.apply(null, ys),
    w: Math.max.apply(null, xs) - Math.min.apply(null, xs),
    h: Math.max.apply(null, ys) - Math.min.apply(null, ys)
  };

  // imageBase64チェック
  if (!state.imageBase64) {
    alert('写真データがありません。最初からやり直してください。');
    document.getElementById('confirmAreaBtn').disabled = false;
    return;
  }

  showLoading('AI解析中...', '開口部・屋根形状を認識しています');

  try {
    var res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        step: 'analyze_area',
        imageBase64: state.imageBase64,
        imageMediaType: state.imageMediaType,
        polyPoints: relPts,
        areaRect: areaRect
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'APIエラー');

    var idx = state.areas.length;
    state.areas.push({
      label: 'エリア' + (idx + 1),
      polyPoints: relPts,
      roofType: data.roofType || 'other',
      gableRatio: data.gableHeightRatio || 0.25,
      openings: data.openings || [],
      buildingInfo: data.buildingInfo || {},
      result: null
    });
    state.currentIdx = idx;
    hideLoading();
    goStep3();

  } catch(e) {
    hideLoading();
    alert('エラー：' + e.message + '

ネットワークエラーの場合はページを再読み込みしてください。');
    document.getElementById('confirmAreaBtn').disabled = false;
  }
}

// ===== Step3へ =====
function goStep3() {
  buildTabs();
  document.getElementById('widthInput').value = '';
  document.getElementById('heightInput').value = '';
  document.getElementById('diagramArea').classList.add('hidden');
  document.getElementById('calcErr').style.display = 'none';
  var bi = state.areas[state.currentIdx].buildingInfo;
  if (bi && bi.style) {
    document.getElementById('buildingNote').textContent = '建物：' + bi.style + '　注意：' + (bi.note || '');
    document.getElementById('buildingNote').style.display = 'block';
  }
  show('step3');
}

// ===== タブ =====
function buildTabs() {
  var html = state.areas.map(function(a, i) {
    var cls = i === state.currentIdx ? 'active' : a.result ? 'done' : '';
    return '<div class="tab ' + cls + '" onclick="switchArea(' + i + ')">' + a.label + (a.result ? ' ✓' : '') + '</div>';
  }).join('');
  document.getElementById('areaTabs').innerHTML = html;
}

function switchArea(idx) {
  state.currentIdx = idx;
  buildTabs();
  var area = state.areas[idx];
  if (area.result) {
    document.getElementById('widthInput').value = area.result.width;
    document.getElementById('heightInput').value = area.result.height;
    drawDiagram(area);
    renderOpTable(area);
    document.getElementById('diagramArea').classList.remove('hidden');
  } else {
    document.getElementById('widthInput').value = '';
    document.getElementById('heightInput').value = '';
    document.getElementById('diagramArea').classList.add('hidden');
  }
  var bi = area.buildingInfo;
  if (bi && bi.style) {
    document.getElementById('buildingNote').textContent = '建物：' + bi.style + '　注意：' + (bi.note || '');
    document.getElementById('buildingNote').style.display = 'block';
  }
}

// ===== 面積計算 =====
async function doCalc() {
  var w = parseFloat(document.getElementById('widthInput').value);
  var h = parseFloat(document.getElementById('heightInput').value);
  var errEl = document.getElementById('calcErr');
  errEl.style.display = 'none';
  if (!w || w <= 0) { errEl.textContent = '横幅を入力してください'; errEl.style.display = 'block'; return; }
  if (!h || h <= 0) { errEl.textContent = '高さを入力してください'; errEl.style.display = 'block'; return; }

  var area = state.areas[state.currentIdx];
  var btn = document.getElementById('calcBtn');
  var spinner = document.getElementById('calcSpinner');
  var btnText = document.getElementById('calcBtnText');
  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = '計算中...';

  try {
    var res = await fetch('/api/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        step: 'calculate_area',
        imageBase64: state.imageBase64,
        imageMediaType: state.imageMediaType,
        width: w,
        height: h,
        roofType: area.roofType,
        gableHeightRatio: area.gableRatio,
        openings: area.openings
      })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || '計算エラー');

    area.result = data;
    buildTabs();
    drawDiagram(area);
    renderOpTable(area);
    document.getElementById('diagramArea').classList.remove('hidden');
    showTotal();

  } catch(e) {
    errEl.textContent = 'エラー：' + e.message;
    errEl.style.display = 'block';
  }

  btn.disabled = false;
  spinner.style.display = 'none';
  btnText.textContent = '📐 面積を計算する';
}

// ===== 図面描画 =====
function drawDiagram(area) {
  var r = area.result;
  if (!r) return;
  var rt = area.roofType;
  document.getElementById('diagramTitle').textContent = area.label + ' 立面図';

  var LM = 20, TM = 55, BM = 40, WW = 260, H = 150;
  var svgW = LM + WW + LM;
  var svgH = TM + H + BM;
  var svg = document.getElementById('diagramSvg');
  svg.setAttribute('viewBox', '0 0 ' + svgW + ' ' + svgH);
  svg.setAttribute('height', svgH);

  var s = '';
  var gPx = Math.min((r.gableH || 0) * 15, 45);

  // 屋根
  if (rt === 'gable') {
    s += '<polygon points="' + LM + ',' + TM + ' ' + (LM + WW/2) + ',' + (TM - gPx) + ' ' + (LM + WW) + ',' + TM + '" fill="#e8e4dc" stroke="#aaa" stroke-width="1"/>';
    s += '<polygon points="' + (LM-5) + ',' + TM + ' ' + (LM+WW/2) + ',' + (TM-gPx-8) + ' ' + (LM+WW+5) + ',' + TM + '" fill="none" stroke="#555" stroke-width="2"/>';
    s += '<text x="' + (LM+WW/2) + '" y="' + (TM-gPx-12) + '" text-anchor="middle" font-size="9" fill="#999">切妻</text>';
    if (r.gableArea > 0) {
      s += '<rect x="' + (LM+WW/2-24) + '" y="' + (TM-gPx/2-7) + '" width="48" height="13" fill="#cc8800" rx="3"/>';
      s += '<text x="' + (LM+WW/2) + '" y="' + (TM-gPx/2+2) + '" text-anchor="middle" font-size="9" font-weight="bold" fill="white">妻壁' + (r.gableArea).toFixed(1) + 'm²</text>';
    }
  } else if (rt === 'flat') {
    s += '<rect x="' + LM + '" y="' + (TM-12) + '" width="' + WW + '" height="10" fill="#777" rx="2"/>';
    s += '<text x="' + (LM+WW/2) + '" y="' + (TM-14) + '" text-anchor="middle" font-size="9" fill="#999">陸屋根</text>';
  } else if (rt === 'shed') {
    s += '<polygon points="' + LM + ',' + TM + ' ' + (LM+WW) + ',' + (TM-35) + ' ' + (LM+WW) + ',' + TM + '" fill="#777"/>';
  } else if (rt === 'hip') {
    s += '<polygon points="' + LM + ',' + TM + ' ' + (LM+WW*0.2) + ',' + (TM-25) + ' ' + (LM+WW*0.8) + ',' + (TM-25) + ' ' + (LM+WW) + ',' + TM + '" fill="#777"/>';
  }

  // 壁
  s += '<rect x="' + LM + '" y="' + TM + '" width="' + WW + '" height="' + H + '" fill="#e8e4dc" stroke="#aaa" stroke-width="1"/>';
  s += '<line x1="' + (LM-8) + '" y1="' + (TM+H) + '" x2="' + (LM+WW+8) + '" y2="' + (TM+H) + '" stroke="#666" stroke-width="2"/>';

  // 開口部（番号のみ）
  var ops = r.openings || [];
  var opN = Math.max(ops.length, 1);
  ops.forEach(function(op, idx) {
    var opW = Math.min(op.width * 13, WW * 0.22);
    var opH = Math.min(op.height * 18, H * 0.65);
    var sp = WW / (opN + 1);
    var opX = LM + sp * (idx + 1) - opW / 2;
    var opY = TM + H - opH - 8;
    var cc = op.confidence === 'high' ? '#1a7a40' : '#cc8800';
    s += '<rect x="' + opX + '" y="' + opY + '" width="' + opW + '" height="' + opH + '" fill="#c8d8e8" stroke="' + cc + '" stroke-width="2" rx="2"/>';
    var cx = opX + opW / 2, cy = opY + opH / 2;
    s += '<rect x="' + (cx-8) + '" y="' + (cy-7) + '" width="16" height="13" fill="' + cc + '" rx="3"/>';
    s += '<text x="' + cx + '" y="' + (cy+3) + '" text-anchor="middle" font-size="9" font-weight="bold" fill="white">' + (idx+1) + '</text>';
  });

  // 横幅（下）
  var sy = TM + H + 18;
  s += '<line x1="' + LM + '" y1="' + sy + '" x2="' + (LM+WW) + '" y2="' + sy + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  s += '<line x1="' + LM + '" y1="' + (sy-5) + '" x2="' + LM + '" y2="' + (sy+5) + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  s += '<line x1="' + (LM+WW) + '" y1="' + (sy-5) + '" x2="' + (LM+WW) + '" y2="' + (sy+5) + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  s += '<rect x="' + (LM+WW/2-30) + '" y="' + (sy+4) + '" width="60" height="14" fill="#2d9e5a" rx="3"/>';
  s += '<text x="' + (LM+WW/2) + '" y="' + (sy+13) + '" text-anchor="middle" font-size="9" font-weight="bold" fill="white">横幅 ' + r.width.toFixed(1) + 'm ✓</text>';

  // 高さ（左）
  var sx = LM - 14;
  s += '<line x1="' + sx + '" y1="' + TM + '" x2="' + sx + '" y2="' + (TM+H) + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  s += '<line x1="' + (sx-4) + '" y1="' + TM + '" x2="' + (sx+4) + '" y2="' + TM + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  s += '<line x1="' + (sx-4) + '" y1="' + (TM+H) + '" x2="' + (sx+4) + '" y2="' + (TM+H) + '" stroke="#2d9e5a" stroke-width="1.5"/>';
  var mid = TM + H / 2;
  s += '<text x="' + (sx-3) + '" y="' + (mid+3) + '" text-anchor="middle" font-size="8" font-weight="bold" fill="#2d9e5a" transform="rotate(-90,' + (sx-3) + ',' + mid + ')">高さ ' + r.height.toFixed(1) + 'm ✓</text>';

  svg.innerHTML = s;
}

// ===== 開口部テーブル =====
function renderOpTable(area) {
  var ops = area.result ? area.result.openings : [];
  var wrap = document.getElementById('opTableWrap');
  if (!ops || ops.length === 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  var rows = ops.map(function(op, i) {
    var conf = op.confidence === 'high' ? '<span style="color:#2d9e5a">高</span>' : '<span style="color:#cc8800">中</span>';
    return '<tr><td>' + (i+1) + '</td><td>' + op.type + '<br><small style="color:#888">×' + op.count + '個</small></td><td style="text-align:center">' + op.width.toFixed(2) + 'm</td><td style="text-align:center">' + op.height.toFixed(2) + 'm</td><td style="text-align:center">' + conf + '</td></tr>';
  }).join('');
  document.getElementById('opTable').innerHTML =
    '<thead><tr><th>№</th><th>種類</th><th>幅</th><th>高さ</th><th>精度</th></tr></thead><tbody>' + rows + '</tbody>';
}

// ===== 全エリア合計 =====
function showTotal() {
  var allWall = 0, allPaint = 0;
  var details = '';
  state.areas.forEach(function(a) {
    if (!a.result) return;
    var r = a.result;
    var wall = r.totalWallArea || r.wallArea;
    allWall += wall;
    allPaint += r.paintArea;
    details += '<div class="detail-row" style="flex-direction:column;align-items:flex-start"><span style="font-weight:700;font-size:13px">' + a.label + '</span></div>';
    details += '<div class="detail-row"><span style="color:rgba(255,255,255,.6);padding-left:8px">外壁面積</span><span>' + wall.toFixed(1) + ' m²</span></div>';
    details += '<div class="detail-row"><span style="color:rgba(255,255,255,.6);padding-left:8px">開口部控除</span><span>−' + r.totalOpening.toFixed(1) + ' m²</span></div>';
    details += '<div class="detail-row"><span style="color:rgba(255,255,255,.6);padding-left:8px">塗装面積</span><span style="color:#7affaa;font-weight:700">' + r.paintArea.toFixed(1) + ' m²</span></div>';
  });
  document.getElementById('rTotal').textContent = allWall.toFixed(1) + ' m²';
  document.getElementById('rPaint').textContent = allPaint.toFixed(1) + ' m²';
  document.getElementById('rDetails').innerHTML = details;
  document.getElementById('totalResult').classList.remove('hidden');
  document.getElementById('totalResult').scrollIntoView({behavior: 'smooth'});
}

function copyResult() {
  var text = '【塗装面積 AI計測結果】\n';
  var totalW = 0, totalP = 0;
  state.areas.forEach(function(a) {
    if (!a.result) return;
    var r = a.result;
    var wall = r.totalWallArea || r.wallArea;
    totalW += wall; totalP += r.paintArea;
    text += '\n' + a.label + '\n横幅：' + r.width.toFixed(1) + 'm　高さ：' + r.height.toFixed(1) + 'm\n外壁面積：' + wall.toFixed(1) + ' m²\n開口部控除：' + r.totalOpening.toFixed(1) + ' m²\n塗装面積：' + r.paintArea.toFixed(1) + ' m²\n';
  });
  text += '\n合計外壁面積：' + totalW.toFixed(1) + ' m²\n合計塗装面積：' + totalP.toFixed(1) + ' m²';
  navigator.clipboard.writeText(text).then(function() {
    var btn = document.querySelector('.copy-btn');
    btn.textContent = '✅ コピーしました！';
    setTimeout(function() { btn.textContent = '📋 jimuuにコピーする'; }, 2000);
  });
}

// ===== 別エリア追加 =====
function addArea() {
  clearArea();
  show('step2');
}

// ===== ローディング =====
function showLoading(text, sub) {
  document.getElementById('loadingText').textContent = text || 'AI解析中...';
  document.getElementById('loadingSub').textContent = sub || 'しばらくお待ちください';
  document.getElementById('loadingOverlay').classList.add('show');
  var p = 0;
  var paint = document.getElementById('brushPaint');
  var icon = document.getElementById('brushIcon');
  state.brushTimer = setInterval(function() {
    p += 1.5; if (p > 100) p = 0;
    paint.style.width = p + '%';
    icon.style.left = 'calc(' + p + '% - 14px)';
  }, 30);
}

function hideLoading() {
  clearInterval(state.brushTimer);
  document.getElementById('loadingOverlay').classList.remove('show');
  document.getElementById('brushPaint').style.width = '0%';
  document.getElementById('brushIcon').style.left = '0px';
}

// ===== 画面切り替え =====
function show(id) {
  ['step1', 'step2', 'step3'].forEach(function(s) {
    var el = document.getElementById(s);
    if (s === id) el.classList.remove('hidden');
    else el.classList.add('hidden');
  });
  window.scrollTo(0, 0);
}

// ===== リセット =====
function resetAll() {
  state.imageBase64 = null;
  state.imageSrc = null;
  state.areas = [];
  state.currentIdx = 0;
  state.polyPoints = [];
  hideLoading();
  // アップロード欄をリセット
  document.getElementById('uploadArea').style.display = 'block';
  document.getElementById('previewArea').style.display = 'none';
  document.getElementById('previewImg').src = '';
  document.getElementById('fileInput').value = '';
  var fi2 = document.getElementById('fileInput2');
  if (fi2) fi2.value = '';
  document.getElementById('step1Next').disabled = true;
  document.getElementById('totalResult').classList.add('hidden');
  show('step1');
}
</script>
